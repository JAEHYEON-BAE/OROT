name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: local
      ADMIN_API_KEY: ci-only-admin-key
      DATABASE_URL: postgresql+asyncpg://orot:ci-only-password@127.0.0.1:5432/orot_ci
      PUBLIC_WEB_URL: http://localhost:3000
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: ""
      SLACK_WEBHOOK_URL: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: orot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orot -d orot_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/core/pyproject.toml
            apps/api/pyproject.toml
            apps/collector/pyproject.toml
      - name: Install Python packages
        run: make install
      - name: Lint, format and type checks
        run: make lint
      - name: Unit and fixture tests
        run: make test
      - name: Apply migrations to disposable database
        run: venv/bin/python -m alembic upgrade head
      - name: PostgreSQL integration checks (fake sender, schema rollback)
        run: venv/bin/python apps/api/tests/integration_runtime.py

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Web regression tests
        run: node --test tests/*.test.mjs
      - name: Production build
        run: npm run build
