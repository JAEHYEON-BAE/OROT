# Alembic 설정. 접속 문자열은 여기 두지 않는다 —
# migrations/env.py 가 orot_core.settings 에서 읽는다 (.env / 환경변수 단일 출처).
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 리비전 파일명에 생성 시각을 붙여 시간순 파악을 쉽게 한다.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
