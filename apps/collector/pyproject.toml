[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vinyl-collector"
version = "0.1.0"
description = "Vinyl Radar 수집기 및 스케줄러"
requires-python = ">=3.12"
dependencies = [
    "vinyl-core",
    "httpx>=0.27,<1",
    "selectolax>=0.3.21",
    "typer>=0.12,<1",
    "apscheduler>=3.10,<4",
    "pywebpush>=2.0,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
collector = "vinyl_collector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
