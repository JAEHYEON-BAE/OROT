[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orot-collector"
version = "0.1.0"
description = "OROT 수집기 및 스케줄러"
requires-python = ">=3.12"
dependencies = [
    "orot-core",
    "httpx>=0.27,<1",
    "selectolax>=0.3.21",
    "typer>=0.12,<1",
    "apscheduler>=3.10,<4",
    "pywebpush>=2.0,<3",
    "requests>=2.32,<3",
    # host_monitor 가 직접 임포트한다. pydantic-settings 를 통해 전이적으로 깔려 있지만,
    # 그쪽이 의존을 바꾸면 호스트 감시만 조용히 죽는다 — 쓰는 쪽에서 선언한다.
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.15",
    "types-requests>=2.32,<3",
]

[project.scripts]
collector = "orot_collector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orot_collector = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
