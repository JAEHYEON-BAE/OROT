[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orot-api"
version = "0.1.0"
description = "OROT REST API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "orot-core",
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.29,<1",
    "pywebpush>=2.0,<3",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orot_api = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
