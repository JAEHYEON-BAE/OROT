[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vinyl-api"
version = "0.1.0"
description = "Vinyl Radar REST API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "vinyl-core",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pywebpush>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
